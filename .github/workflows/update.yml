name: Update Happ subscription

on:
  schedule:
    # Запуск примерно раз в час
    - cron: "17 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "update.py"
      - "sources.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-happ-subscription
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build subscription
        run: python update.py

      - name: Commit changed subscription
        shell: bash
        run: |
          if git diff --quiet -- happ.txt; then
            echo "happ.txt has not changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add happ.txt
          git commit -m "chore: update Happ subscription"
          git push
