name: Update Happ subscriptions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "update.py"
      - "sources.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-happ-subscriptions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update feeds
        run: python update.py

      - name: Commit feeds and counters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add happ.txt happ_all.txt happ_tcp.txt stats.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh Happ whitelist feeds"
          git push
